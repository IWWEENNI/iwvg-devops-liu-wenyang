name: CD Staging
on:
  push:
    branches: ['staging']

env:
  REPOSITORY: ${{ github.repository }}
  GHCR_URL: ghcr.io

jobs:
  cd-staging:
    name: Build & Push & Deploy on Render (Staging)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Extract artifact from pom
        run: |
          echo "VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_ENV
          echo "ARTIFACT=$(mvn help:evaluate -Dexpression=project.artifactId -q -DforceStdout)" >> $GITHUB_ENV
          echo "REPOSITORY_LC=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.GHCR_URL }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PERSONAL_ACCESS_TOKEN }}

      - name: Build & Push Docker image
        uses: docker/build-push-action@0a97817b6ade9f46837855d676c4cca3a2471fc9 # v4.2.1
        with:
          context: .
          push: true
          tags: |
            ${{ env.GHCR_URL }}/${{ env.REPOSITORY_LC }}:staging-${{ env.VERSION }}
            ${{ env.GHCR_URL }}/${{ env.REPOSITORY_LC }}:staging

      # Render: Web Service -> Settings -> Deploy Hook -> copiar token
      # GitHub: Settings -> Secrets -> RENDER_DEPLOY_HOOK_TOKEN
      - name: Deploy on Render (Staging)
        run: |
          curl --fail -X POST "${{ secrets.RENDER_DEPLOY_HOOK_TOKEN }}" \
            && echo "✅ Deployment triggered successfully" \
            || (echo "❌ Deployment failed" && exit 1)