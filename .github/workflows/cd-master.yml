name: CD Master
on:
    push:
      branches: ['master']

jobs:
  cd-master:
    name: Build & Push GitHub Package & Deploy on AWS Lightsail
    runs-on: ubuntu-22.04

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: 🏷️ Prepare container image metadata (repository in lowercase, artifact, version...)
        run: |
          echo "REPOSITORY=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
          echo "ARTIFACT=$(mvn help:evaluate -Dexpression=project.artifactId -q -DforceStdout)" >> $GITHUB_ENV
          echo "VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_ENV

      - name: 📦 Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PERSONAL_ACCESS_TOKEN }}

      - name: 🐳 Build & Push Docker image
        uses: docker/build-push-action@0a97817b6ade9f46837855d676c4cca3a2471fc9 # v4.2.1
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.REPOSITORY }}:${{ env.VERSION }}
            ghcr.io/${{ env.REPOSITORY }}:latest

      - name: 🚀 Deploy on AWS Lightsail
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.AWS_LIGHTSAIL_IP_MAIN }}
          username: ${{ secrets.AWS_LIGHTSAIL_USER_MAIN }}
          key: ${{ secrets.AWS_LIGHTSAIL_SSH_KEY_MAIN }}
          envs: GHCR_TOKEN,GHCR_ACTOR,REPOSITORY,ARTIFACT,DATABASE_URL,DATABASE_USER,DATABASE_PASSWORD
          script: |
            echo $GHCR_TOKEN | sudo docker login ghcr.io -u $GHCR_ACTOR --password-stdin
            sudo docker network create devops 2>/dev/null || true

            sudo docker pull ghcr.io/$REPOSITORY:latest
            sudo docker rm -f $ARTIFACT || true
            sudo docker run -d \
              --name $ARTIFACT \
              --restart always \
              --memory 512m \
              --memory-swap 1024m \
              --network devops \
              -p 8080:8080 \
              -e SPRING_PROFILES_ACTIVE=prod \
              -e DATABASE_URL="$DATABASE_URL" \
              -e DATABASE_USER="$DATABASE_USER" \
              -e DATABASE_PASSWORD="$DATABASE_PASSWORD" \
              ghcr.io/$REPOSITORY:latest

            echo "⏳ Esperando a que se levante..."
            for i in $(seq 1 6); do
              sleep 15
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/actuator/health 2>/dev/null || echo "000")
              echo "Intento $i: HTTP $STATUS"
              [ "$STATUS" = "200" ] && break
            done

            if [ "$STATUS" != "200" ]; then
              echo "❌ Deploy fallido"
              sudo docker logs --tail 50 $ARTIFACT
              exit 1
            fi

            echo "✅ Deploy exitoso"
            sudo docker image prune --filter "until=12h" -f
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_PERSONAL_ACCESS_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
